<html>
    <head>
        <title>Helping Hand</title>
        <script src="https://code.iconify.design/2/2.2.1/iconify.min.js"></script>
        
        <!-- Fonts & Icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="index.css">
    </head>
    <body class="contact-page">
        <main id="main">
            <!-- Form section -->
            <section class="contact-form-section">
                <form>
                    <h1 class="contact-form-heading">Helping <span>Hand </span></h1>
                    <div class="contact-form-intro">Curious about something? Complete these fields and "get in touch", as you humans say. 🤙</div>
                    <label for="name">Full Name</label>
                    <input id="name" class="contact-input" type="text" placeholder="Jack Smith" />
                    <label for="email">Email</label>
                    <input id="email" class="contact-input" type="text" placeholder="JackSmith@mail.com" />
                    <label for="message">Message</label>
                    <textarea id="message" class="contact-textarea" rows="4" cols="50" placeholder="Your message..."></textarea>
                    <button class="contact-submit-button" type="button" onclick="submitForm()">Reach Out🎉</button>
                </form>
                <img class="contact-image" src="images/connect.png" alt="a robotic hand is reaching out from the top to a human hand" />
            </section>
        </main>
    </body>
</html>
